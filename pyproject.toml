[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marl_lob"
version = "0.0.1"
description = "Multi-agent reinforcement learning in limit order books."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "gymnasium",
    "pettingzoo",
    "stable-baselines3",
    "torch",
    "supersuit",
    "tensorboard",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.90",
    "ruff>=0.4",
]
notebook = [
    "ipykernel>=6",
    "nbformat>=5",
    "nbclient>=0.10",
    "nbconvert>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "abides: integration tests requiring patched ABIDES (marker selects, not skips)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
